server:
  port: ${PORT:8081}
  shutdown: graceful

spring:
  application:
    name: hr-service
  datasource:
    url: ${HR_DB_URL:jdbc:postgresql://localhost:5432/hr}
    username: ${HR_DB_USERNAME:pha}
    password: ${HR_DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      # Flyway owns the schema; Hibernate never changes it.
      ddl-auto: none
  data:
    web:
      pageable:
        default-page-size: 20
        max-page-size: 100
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${OIDC_ISSUER_URI:http://localhost:8180/realms/pha-hmg}
          audiences: ${OIDC_AUDIENCE:pha-hmg-api}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
