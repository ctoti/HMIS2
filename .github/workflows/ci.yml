name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  java:
    name: Java build and test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
          cache-dependency-path: "**/pom.xml"
      - run: mvn -B -ntp verify

  typescript:
    name: TypeScript lint, typecheck, test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  security:
    name: Secrets, SAST and dependency scan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GITLEAKS_VERSION: v8.30.1
      OSV_SCANNER_VERSION: v2.6.0
      SEMGREP_VERSION: "1.177.0"
      CYCLONEDX_VERSION: "2.9.3"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
          cache-dependency-path: "**/pom.xml"
      - name: Install scanners
        run: |
          go install "github.com/zricethezav/gitleaks/v8@${GITLEAKS_VERSION}"
          go install "github.com/google/osv-scanner/v2/cmd/osv-scanner@${OSV_SCANNER_VERSION}"
          pip install "semgrep==${SEMGREP_VERSION}"
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Secret scan (gitleaks)
        run: gitleaks dir . --redact --no-banner
      - name: SAST (Semgrep)
        run: semgrep scan --error --metrics=off --config p/java --config p/typescript --config p/secrets .
      # Internal modules (com.pha:*) are not on Maven Central, so OSV cannot resolve our poms itself.
      # Maven resolves the real dependency tree into a CycloneDX SBOM, which OSV scans instead.
      - name: Build Java SBOM (CycloneDX)
        run: mvn -B -ntp -q -DskipTests -Djacoco.skip=true package org.cyclonedx:cyclonedx-maven-plugin:${CYCLONEDX_VERSION}:makeAggregateBom -DoutputFormat=json -DoutputName=bom
      - name: Dependency scan (OSV-Scanner)
        run: osv-scanner scan source --lockfile package-lock.json --lockfile target/bom.json
